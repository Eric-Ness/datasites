id: co2-monthly
version: 1                       # bump on any schema change; forces a rebuild
title: Monthly atmospheric CO2
description: >-
  Monthly mean atmospheric carbon dioxide at Mauna Loa Observatory (1958 to
  present) and the global marine-surface average (1979 to present), with the
  seasonal-cycle-removed trend.
pipeline: datasites_climate.noaa_gml_co2
check_every: P1D                 # how often the pipeline looks for new data
cadence: P1M                     # how often the source should change
sla: P45D                        # "stale-upstream" if the source has not changed in this window
source:
  id: noaa-gml-co2
  name: NOAA Global Monitoring Laboratory, Trends in Atmospheric Carbon Dioxide
  publisher: NOAA GML
  url: https://gml.noaa.gov/ccgg/trends/
  license: LicenseRef-US-Government-Work
  commercial_ok: true
  attribution: >-
    Lan, X., Tans, P. and K.W. Thoning: Trends in globally-averaged CO2
    determined from NOAA Global Monitoring Laboratory measurements.
    NOAA GML (https://gml.noaa.gov/ccgg/trends/). Mauna Loa data from March 1958
    to April 1974 obtained by C. David Keeling, Scripps Institution of Oceanography.
series:
  average: Monthly mean mole fraction
  trend: Monthly mean with the average seasonal cycle removed
locations:
  noaa-mlo: Mauna Loa Observatory, Hawaii
  world: Global marine surface average
# uncertainty is null where NOAA gives none (Scripps era, interpolated months, trend series at Mauna Loa).
# interpolated is true where NOAA marks the month with a negative standard deviation, and null for the
# Scripps era (before May 1974) and the global series, where the source has no such flag.
schema:
  - { name: date, type: month }
  - { name: value, type: float, unit: ppm }
  - { name: uncertainty, type: float, unit: ppm, nullable: true }
  - { name: interpolated, type: bool, nullable: true }
checks:
  rows_min_ratio: 0.995          # block if rows drop below 99.5% of the previous version
  ranges:
    value: [250, 600]
    uncertainty: [0, 5]
  max_null_fraction:
    value: 0
  newest_not_older: true         # block if the newest date goes backwards
  revisions: { max_changed_fraction: 0.05, tolerance: 0.05 }   # warn only
