id: crime-monthly
version: 1                       # bump on any schema change; forces a rebuild
kind: series
title: Crimes reported each month, by state
description: >-
  Violent and property crimes reported to the FBI by police in every state each month since 2018, with how many
  were cleared and how much of the state's population the reporting agencies cover. Reported figures, not
  estimates: the coverage columns say how complete each month is.
pipeline: datasites_justice.crime_monthly
requires_env: [DATA_GOV_API_KEY]
check_every: P7D                 # 102 requests a run; the FBI refreshes the CDE monthly
cadence: P1M
sla: P3M
source:
  id: fbi-cde-summarized
  name: FBI Crime Data Explorer, summarized reported offenses by state (CDE API)
  publisher: Federal Bureau of Investigation (FBI), Uniform Crime Reporting Program
  url: https://cde.ucr.cjis.gov/
  license: LicenseRef-US-Government-Work
  commercial_ok: true            # work of a US federal agency (17 USC 105)
  attribution: >-
    Federal Bureau of Investigation, Crime Data Explorer, https://cde.ucr.cjis.gov/ (summarized offenses, via
    the CDE API on api.data.gov).
series:
  violent-crime: Violent crime (murder and nonnegligent manslaughter, rape, robbery, aggravated assault)
  property-crime: Property crime (burglary, larceny-theft, motor vehicle theft)
locations:
  registry: us-state
  explicit:
    usa: United States
# Notes on the CDE's data, kept as published:
# - Reported, not estimated: each month counts only the agencies that sent data. Compare months and states
#   with coverage_pct in mind.
# - The most recent months are incomplete until late reports arrive, so they can rise for months.
# - Rates are per 100,000 people covered by the reporting agencies (covered_population), not the whole state.
# - The CDE's national figures come with rates and coverage only, so the US rows have no counts.
# - 2021 is the year many large agencies stopped reporting while moving to NIBRS: coverage is low in many states.
schema:
  - { name: date, type: month }
  - { name: offenses, type: int, unit: offenses, nullable: true, description: "Offenses reported by the state's agencies; null for the US" }
  - { name: clearances, type: int, unit: offenses, nullable: true, description: "Offenses cleared by arrest or exceptional means; null for the US" }
  - { name: offense_rate, type: float, unit: per 100k, nullable: true, description: "Offenses per 100,000 people covered by the reporting agencies" }
  - { name: clearance_rate, type: float, unit: per 100k, nullable: true, description: "Clearances per 100,000 people covered by the reporting agencies" }
  - { name: coverage_pct, type: float, unit: "%", nullable: true, description: "Percent of the population covered by agencies that reported that month" }
  - { name: population, type: int, unit: people, nullable: true, description: "Population of the state (or US) used by the FBI" }
  - { name: covered_population, type: int, unit: people, nullable: true, description: "Population covered by the agencies that reported" }
checks:
  min_rows: 9000
  rows_min_ratio: 0.98
  ranges:
    offenses: [0, 1000000]
    clearances: [0, 1000000]
    offense_rate: [0, 10000]
    coverage_pct: [0, 100]
  newest_not_older: true
