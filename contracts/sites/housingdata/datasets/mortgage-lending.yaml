id: mortgage-lending
version: 1                       # bump on any schema change; forces a rebuild
kind: table
title: Mortgage applications and loans by county (HMDA)
description: >-
  Home lending in every US county and state and the nation, from 2018, from the loan-level records every
  mortgage lender reports under the Home Mortgage Disclosure Act: applications, loans made, denials and the
  denial rate, and the total and median amount lent, by year and loan purpose (home purchase, refinance,
  cash-out refinance, home improvement, other). Counted from the CFPB's yearly snapshot of the public data.
pipeline: datasites_housing.hmda_lending
check_every: P7D                 # one 1-byte request per year when nothing changed; a new year comes out each spring
cadence: P1Y
sla: P20M                        # the snapshot of year Y comes out in spring Y+1 (2025's: June 2026)
source:
  id: cfpb-hmda-snapshot
  name: CFPB / FFIEC, HMDA Snapshot National Loan-Level Dataset (public LAR)
  publisher: Consumer Financial Protection Bureau, for the Federal Financial Institutions Examination Council
  url: https://ffiec.cfpb.gov/data-publication/snapshot-national-loan-level-dataset
  license: LicenseRef-US-Government-Work
  commercial_ok: true            # work of a US federal agency (17 USC 105)
  attribution: >-
    Consumer Financial Protection Bureau and Federal Financial Institutions Examination Council, HMDA Snapshot
    National Loan-Level Dataset (https://ffiec.cfpb.gov/data-publication/snapshot-national-loan-level-dataset).
    Aggregated by housingdata.dev.
key: [year, location, loan_purpose]
partition: year
# Counting rules (see pipelines/housing/src/datasites_housing/hmda_lending.py):
# - applications are HMDA actions 1-5; purchased loans (6) and preapproval requests (7, 8) are left out;
# - the denial rate is denials over decided applications (actions 1-3);
# - amounts use HMDA's public loan_amount, the midpoint of a $10,000 band, so they are approximate;
# - records without a county count toward their state and the nation only.
# The snapshot is the first release of each year; HMDA's later one-year and three-year datasets can differ
# slightly (filers' resubmissions).
schema:
  - { name: year, type: year, description: HMDA reporting year (activity_year) }
  - { name: location, type: str, description: "us-county-<5-digit FIPS>, us-<state>, or usa" }
  - { name: loan_purpose, type: str, description: "home-purchase, home-improvement, refinance, cash-out-refinance or other (HMDA codes 1, 2, 31, 32, 4)" }
  - { name: applications, type: int, unit: applications, description: Applications that were originated, approved but not accepted, denied, withdrawn or closed as incomplete }
  - { name: originations, type: int, unit: loans, description: Loans made (action 1) }
  - { name: denials, type: int, unit: applications, description: Applications denied (action 3) }
  - { name: denial_rate, type: float, unit: percent, nullable: true, description: Denials as a percent of applications that reached a decision (actions 1-3) }
  - { name: originated_amount, type: int, unit: USD, description: Sum of the loan amounts of the loans made }
  - { name: median_originated_amount, type: int, unit: USD, nullable: true, description: Median loan amount of the loans made }
  - { name: source_url, type: str, description: The snapshot file the row was counted from }
  - { name: source_etag, type: str, description: "The snapshot file's ETag when it was counted (an unchanged ETag means the row is reused)" }
checks:
  min_rows: 120000               # about 16,000 rows a year from 2018
  rows_min_ratio: 0.98
  ranges:
    denial_rate: [0, 100]
    applications: [0, 20000000]
    originations: [0, 20000000]
  max_null_fraction:
    median_originated_amount: 0.15   # places and purposes with no loans made
