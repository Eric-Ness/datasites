id: waterdata
domain: waterdata.dev
name: Water Data
tagline: Daily streamflow at every active US stream gage, and drought by county.
description: >-
  Daily mean flow for the last 400 days at every active USGS stream gage, with
  approval and ice flags, plus weekly US Drought Monitor categories for every
  county. Built on the new USGS Water Data APIs: a stable replacement for
  scripts that used the legacy WaterServices API.
status: live
phase: 2
