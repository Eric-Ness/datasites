name: deploy

# Deploys the API Worker and the website of every launched site when main changes. Stays off until the
# repository variable DEPLOY_ENABLED is "true" and the Cloudflare secrets exist (see docs/SETUP.md).
#
# To launch another site, once its zone is Active in Cloudflare: add its id to WEB_SITES below and its
# api.<domain> route to apps/api/wrangler.jsonc, in the same change.

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "contracts/sites/*/site.yaml", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25 # builds each site and waits out new custom-domain certificates
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Sites whose apex domain serves the real website (apps/web/wrangler/<id>.jsonc) and whose API answers
      # at api.<id>.dev. Every id here needs its zone Active in Cloudflare.
      WEB_SITES: climatedata electiondata
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:registry
      - run: pnpm typecheck
      - run: pnpm test

      - name: Deploy API Worker
        run: pnpm --filter @datasites/api exec wrangler deploy

      - name: Build and deploy websites
        run: |
          for site in $WEB_SITES; do
            SITE=$site pnpm --filter @datasites/web run build
            pnpm --filter @datasites/web exec wrangler deploy -c "wrangler/$site.jsonc"
          done

      - name: Smoke test
        shell: bash
        run: |
          # A newly attached custom domain can take a minute or two to get its certificate, so each request retries.
          fetch() { curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "$@"; }
          for site in $WEB_SITES; do
            domain="$site.dev"
            fetch -o /dev/null "https://$domain/"
            fetch -o /dev/null "https://$domain/datasets/"
            fetch "https://api.$domain/v1" | grep -q "\"site\":\"$site\""
            fetch -o /dev/null "https://api.$domain/v1/status"
            echo "ok: https://$domain and https://api.$domain" | tee -a "$GITHUB_STEP_SUMMARY"
          done
