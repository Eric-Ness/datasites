name: ingest-voting

# Daily look at votingdata.net's roll-call votes: the House Clerk's and the Senate's roll-call XML. A normal day
# fetches the newest votes of each chamber (a few dozen requests). Until the history since 1989 is complete,
# each run also fetches up to 3,000 older votes, newest first (about 35,000 in all, so roughly two weeks of
# daily runs); index.json says how many are still to fetch.
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.

on:
  schedule:
    - cron: "43 7 * * *" # daily 07:43 UTC, after both chambers' evening votes are posted; odd minute
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: votingdata
      target:
        type: choice
        options: [production, staging]
        default: production
      force:
        type: boolean
        description: "Run even if a dataset was checked recently (skips the check_every wait)"
        default: true

permissions:
  contents: read

concurrency:
  group: ingest-voting
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a backfill run fetches up to 3,000 votes
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_VOTING }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping tickharbor (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'votingdata' }}"
          --target "${{ inputs.target || 'production' }}"
          ${{ inputs.force && '--force' || '' }}
          --alert-after 2
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping tickharbor (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
