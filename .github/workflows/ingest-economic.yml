name: ingest-economic

# Daily check of every economicdata.dev dataset. Conditional GETs make no-change days nearly free.
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.
# CENSUS_API_KEY is optional: without it census-acs-income reports needs-credentials. BEA is read from its keyless bulk zip.
# --alert-after 2: a source that is down for one run (the World Bank API timed out and then answered 400 on
# 2026-11-14) keeps its last version without failing the job; the second miss in a row does. Other errors fail it at once.

on:
  schedule:
    - cron: "47 13 * * *" # 13:47 UTC: after BLS's 08:30 ET releases in both EDT and EST; odd minute
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: economicdata
      target:
        type: choice
        options: [production, staging]
        default: production
      force:
        type: boolean
        description: "Run even if a dataset was checked recently (skips the check_every wait)"
        default: true

permissions:
  contents: read

concurrency:
  group: ingest-economic
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_ECONOMIC }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping tickharbor (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'economicdata' }}"
          --target "${{ inputs.target || 'production' }}"
          ${{ inputs.force && '--force' || '' }}
          --summary "$GITHUB_STEP_SUMMARY"
          --alert-after 2
      - name: Ping tickharbor (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
