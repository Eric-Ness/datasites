name: ingest-satellite

# Daily check of every satellitedata.dev dataset:
#   - satellite-catalog and launches: conditional GETs of GCAT's TSV files on planet4589.org (one person's
#     site: ETags make an unchanged day a handful of 304s). GCAT regenerates its files around 01:15 UTC,
#     so this runs a couple of hours later.
#   - gp-current: one Space-Track login, one bulk GP query and a logout. Space-Track asks for GP pulls at
#     most hourly and at a minute other than :00 or :30; this runs once a day at :19. Without the two
#     SPACETRACK_* secrets the run reports it as needs-credentials and carries on.
# Stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md).

on:
  schedule:
    - cron: "19 3 * * *" # 03:19 UTC; odd minutes avoid GitHub's top-of-the-hour queue
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: satellitedata
      target:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: ingest-satellite
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_SATELLITE }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping healthchecks.io (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'satellitedata' }}"
          --target "${{ inputs.target || 'production' }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping healthchecks.io (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
