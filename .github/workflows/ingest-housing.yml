name: ingest-housing

# Weekly look at every housingdata.dev dataset. FHFA reissues its annual county and state indexes about
# once a year (March) and the Building Permits Survey's annual county file comes out each May, so most weeks
# end with every source unchanged: the permit files answer conditional GETs with 304, and FHFA's 5 MB of
# workbooks are downloaded and hashed (FHFA sends no ETag or Last-Modified).
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.

on:
  schedule:
    - cron: "29 10 * * 3" # Wednesdays 10:29 UTC: both datasets have check_every P7D; odd minute
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: housingdata
      target:
        type: choice
        options: [production, staging]
        default: production
      force:
        type: boolean
        description: "Run even if a dataset was checked recently (skips the check_every wait)"
        default: true

permissions:
  contents: read

concurrency:
  group: ingest-housing
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_HOUSING }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping tickharbor (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'housingdata' }}"
          --target "${{ inputs.target || 'production' }}"
          ${{ inputs.force && '--force' || '' }}
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping tickharbor (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
