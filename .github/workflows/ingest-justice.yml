name: ingest-justice

# Weekly look at every justicedata.dev dataset, through the FBI Crime Data Explorer API on api.data.gov.
# crime-monthly (check_every P7D) makes 102 requests a run; crime-estimates (P30D) about 550 once a month. The key
# is the same api.data.gov key the water pipeline uses (1,000 requests an hour), so this runs at night, far from
# ingest-water's 11:41 UTC run. A DATA_GOV_API_KEY secret, if set, is used instead of USGS_WATERDATA_API_KEY.
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.

on:
  schedule:
    - cron: "17 3 * * 2" # Tuesdays 03:17 UTC; odd minute
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: justicedata
      target:
        type: choice
        options: [production, staging]
        default: production
      force:
        type: boolean
        description: "Run even if a dataset was checked recently (skips the check_every wait)"
        default: true

permissions:
  contents: read

concurrency:
  group: ingest-justice
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_JUSTICE }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping tickharbor (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY || secrets.USGS_WATERDATA_API_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'justicedata' }}"
          --target "${{ inputs.target || 'production' }}"
          ${{ inputs.force && '--force' || '' }}
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping tickharbor (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
