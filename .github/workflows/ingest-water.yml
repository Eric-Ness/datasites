name: ingest-water

# Daily refresh of every waterdata.dev dataset. USGS daily values are re-read over the whole 400-day window
# (provisional values are revised for months), so a run takes about 10 minutes rather than one.
# Stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md).

on:
  schedule:
    - cron: "41 11 * * *" # 11:41 UTC, early morning across the US; odd minutes avoid GitHub's top-of-the-hour queue
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: waterdata
      target:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: ingest-water
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # anonymous USGS limits can stretch a run past 30 minutes; the API key avoids that
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_WATER }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping healthchecks.io (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          USGS_WATERDATA_API_KEY: ${{ secrets.USGS_WATERDATA_API_KEY }} # optional; raises the USGS rate limit
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'waterdata' }}"
          --target "${{ inputs.target || 'production' }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping healthchecks.io (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
