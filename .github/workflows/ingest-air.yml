name: ingest-air

# Daily check of every airdata.dev dataset. Conditional GETs make unchanged AirData years free (a 304 each).
#   - county-aqi-daily changes every day: AirNow adds yesterday's file, so the ~12M-row table is rebuilt and
#     its per-county files re-uploaded daily. Measured locally: ~7 min a day (about 415 conditional GETs,
#     then ~2 min of transform and file building), ~13 min for a first build that downloads everything.
#     Once a day is plenty: AirNow's daily file for a date settles about a day later.
#   - county-aqi-annual is a few 304s except after EPA's twice-yearly AirData release.
# Stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md).

on:
  schedule:
    - cron: "19 16 * * *" # 16:19 UTC, after AirNow finalizes the day before (~23:50 UTC); odd minutes avoid GitHub's top-of-the-hour queue
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: airdata
      target:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: ingest-air
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a first build fetches ~410 files (47 AirData years, a year of AirNow days); later days take minutes
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_AIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping healthchecks.io (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Add swap space
        # A county-aqi-daily rebuild peaked at 4.7 GB on a first build (the 12M-row table and ~3 GB of output
        # files held before upload); later builds also load the previous version's table for validation
        # (~1 GB more), close to a private-repo runner's 7 GB. Extra swap keeps the daily rebuild alive.
        run: |
          sudo fallocate -l 8G /mnt/datasites.swap
          sudo chmod 600 /mnt/datasites.swap
          sudo mkswap /mnt/datasites.swap
          sudo swapon /mnt/datasites.swap
          free -h
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'airdata' }}"
          --target "${{ inputs.target || 'production' }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping healthchecks.io (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
