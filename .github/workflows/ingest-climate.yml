name: ingest-climate

# Daily check of every climatedata.dev dataset. Conditional GETs make no-change days nearly free:
# most days this is a few 304s and a 9-byte procdate.txt. The heavy days are planned:
#   - county-climate rebuilds once a month when NCEI reissues nClimDiv (~20M rows, ~3 GB of output files);
#   - world-capitals is due weekly (check_every P7D) and makes ~200 paced NASA POWER requests (temperature only) (~12 min).
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.

on:
  schedule:
    - cron: "23 14 * * *" # 14:23 UTC; odd minutes avoid GitHub's top-of-the-hour queue
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: climatedata
      target:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: ingest-climate
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a county-climate rebuild and the weekly capitals pass can land on the same day
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_CLIMATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping healthchecks.io (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Add swap space
        # A county-climate rebuild peaks near 9 GB of memory (the engine holds every output file before
        # uploading), above the 7 GB of a private-repo runner. Extra swap keeps that monthly run from being
        # killed; on ordinary days it is never touched.
        run: |
          sudo fallocate -l 8G /mnt/datasites.swap
          sudo chmod 600 /mnt/datasites.swap
          sudo mkswap /mnt/datasites.swap
          sudo swapon /mnt/datasites.swap
          free -h
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'climatedata' }}"
          --target "${{ inputs.target || 'production' }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping healthchecks.io (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
