name: ingest-carbon

# Weekly check of every carbondata.dev dataset. The sources change yearly (Hub, eGRID, USEEIO, DESNZ,
# Global Carbon Budget) or about monthly (Ember), and Zenodo serves its files in full on every request,
# so the contracts set check_every: P7D and this runs once a week.
# The schedule stays off until the repository variable INGEST_ENABLED is "true" (see docs/SETUP.md); manual runs
# (Actions → Run workflow) always work, for example to fill the staging bucket.

on:
  schedule:
    - cron: "41 6 * * 2" # Tuesdays 06:41 UTC; odd minutes avoid GitHub's top-of-the-hour queue
  workflow_dispatch:
    inputs:
      dataset:
        description: "<site> or <site>/<dataset>"
        default: carbondata
      target:
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: ingest-carbon
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.INGEST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' # the switch only gates the schedule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target || 'production' }}
    defaults:
      run:
        working-directory: pipelines
    env:
      HC_URL: ${{ secrets.HC_INGEST_CARBON }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # exact tag: setup-uv has no moving major tag
        with:
          enable-cache: true
      - name: Ping healthchecks.io (start)
        if: env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/start" || true
      - name: Run pipelines
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: >
          uv run --frozen datasites run "${{ inputs.dataset || 'carbondata' }}"
          --target "${{ inputs.target || 'production' }}"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Ping healthchecks.io (result)
        if: always() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/${{ job.status == 'success' && '0' || '1' }}" || true
