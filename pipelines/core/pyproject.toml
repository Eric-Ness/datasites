[project]
name = "datasites-core"
version = "0.2.0"
description = "Fetch, validate and publish engine shared by every datasites pipeline"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "boto3>=1.36",
  "httpx>=0.27",
  "polars>=1.0",
  "pyyaml>=6",
]

[project.scripts]
datasites = "datasites_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasites_core"]
