[project]
name = "datasites-justice"
version = "0.1.0"
description = "Pipelines for justicedata.dev"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["datasites-core", "polars>=1.0"]

[tool.uv.sources]
datasites-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasites_justice"]
